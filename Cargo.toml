[package]
name = "ps-compress"
version = "0.1.0-18"
edition = "2021"
description = "Deterministic Zstandard compression for small binary payloads"
documentation = "https://docs.rs/ps-compress"
readme = "README.md"
repository = "https://github.com/prokopschield/ps-compress"
license = "GPL-3.0-or-later"
keywords = ["compression", "deterministic", "storage", "zstd"]
categories = ["compression", "encoding"]

[dependencies]
ps-buffer = "0.1.0-22"
thiserror = "2.0.19"

[dependencies.zstd-safe]
version = "=7.2.4"
default-features = false

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
